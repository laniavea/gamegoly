	"(При выборе следующей случ. игры) Ролится случайное число от 1 до 12 и умножается на 5. Это и +- 5 долларов - цена следующей игры",
	"Следующие кубики - 0, 0. Во время второго ролла выбирается любая игра, подходящая под условия клетки",
