[field]
title = "GameGoly 2025"
base_dice = "1,6 1,6"
# TODO: Make link autogen from config params
help_info = [
	"{{Основная идея}}GameGoly посвящена прохождению игр, вышедших в 2025 году в сервисе steam. Настолка играется с использованием приложения и сервиса steamdb дефолтной ссылке - см прошлые версии. .\nВсе модификаторы, полученные здесь, следует добавить в steamdb поиск. Порядок тегов определяется по расширенному виду тегов в steam, а не в steamdb!",
	"{{Порядок хода}}1) Передвижение по полю (бросок 2x кубиков d6, если нету особых условий)\n2) Выбор тегов (нажать на клетку, посмотреть число игр по каждому из тегов и просуммировать их, затем бросить случайное число от 1 до суммы и этим определить единственный тег)\n3) Выбор игры (выбрать в поиске steamdb основной выпавший тег, добавить дополнительные модификаторы если есть и выбрать случайную из игр, используя сгенерированное число\n4) Выбор использованный модификаторов\n 5) Прохождение игры (ну или дроп)",
	"{{Бросок кубиков}}Основным способом передвижением по полю явяeтся бросок 2x шестигранных кубиков, их число и цифры на них могут быть изменены особыми условиями. Если кубика два, то существуют 6 дополнительных модификаторов на игру из-за броска кубика.\n1) В случае выпадения дубля - игроку добавляется доп.тег.\n2) Если сумма кубов равна 6, то игрок крутит дополнительный модификатор - спешл.\n3) Если сумма кубов равна 10, то игрок добавляет себе спешл.\n4) Если абсолютная разница между значениями кубиков 3 и больше, то добавляется перевод половины\n5) Если сумма кубиков равна 2, то добавляются 2 спешла\n6)Если сумма больше 10, то добавляется 1 геймплейный тег, 1 стилистический",
	"{{Выбор тегов}}После заверешения передвижения, на клетке может быть несколько условий для игры, если для одного условия существует несколько возможных вариантов, то игрок обязан использовать только один, например для поля Tactic. Для совершения выбора игрок должен записать число игр из steamdb для каждого из вариантов и просуммировать их от большего к меньшему, затем выкинуть число от 1 до суммы. Та область на которую упало число и есть итоговый выбор.\nПример: Тег А - 10 игр, Тег Б - 15 игр, Тег В - 11 игр. Ролл от 1 до 36 - 20. Следовательно будет браться тег В. 15 (Тег А) < ролл < 26 (Тег А + Тег В)",
	"{{Выбор игры}}Если итоговое условие определено или клетка не требует такого, то дальше игрок на любой клетке (кроме спешл), добавляет модификаторы для поиска в steamdb (доп.теги и другие условия). После этого steamdb покажет итоговое число игр, подходящих условию. Далее производится ролл от 1 до указанного числа, таким образом выбирается игра. Игрок, если может, то он способен перенести половину, для этого надо разделить число всех игр на 2 (округлять в меньшую) и прибавить или убавить это число к полученному роллу.",
	"{{Прохождение игры}}Каждый круг игроку начисляется один дроп, который можно использовать и завершить ход. В случае дропа без доступных дропов игрок отправляется в тюрьму без прохождения круга",
	"{{Рероллы}}Игрок может реролльнуть игру если:\n1) Если основной тег не находятся в топ-10 на steam странице (или в первой половине если тегов меньше 14)\n2) Если игра противоречит его моральным принципам (gore, сексуальный контент, gaysex и т.п.)\n3) Если игра - симулятор, MMO, пустышка, скам-игра, текстовый квест, ферма, настолка, бесконечная или ой-извините + denuvo(нет в свободном доступе)\n4) Если альтерантивы для игры недоступны (перенос половины и т.п. в т.ч. игры из зоны)",
	"{{Рероллы 2}}Если 10 игр подряд были реролльными, то игрок начинает убирать сначала спешлы, потом доп.теги по 5 доп. рероллов на каждый. Если все убрано, то игрок просто роллит игру по основному тегу и выбирает любую игру между выпавшей и 10 соседними (+11 если half-move), далее он удаляет все доп.теги и спешлы, которые применимы к этой игре",
	"{{Тюрьма}}Если игрок попадает в тюрьму, то его максимальный рейтинг - 85%. Далле игрок роллит дополнительный тег, используя кнопку слева, и играет в случайную игру. Если игра - кал и игрок ее хочет дропнуть, то без проблем - реролл тега -> реролл игры.",
	"{{ТОП-100}}При нахождении на клетке ТОП-100 игрок роллит случайную игру из первых 100 без условий (если нет доп.тега или спешела, меняющие эти условия)",
	"{{Спешл}}Если игрок получает спешл во время совершения броска кубиков, то его необходимо применить к следующей игре или ходу. Если игрок по результатам спешла остается на данной клетке, то игрок выбирает ЛЮБУЮ игру, которую он хочет пройти или роллит по доп.тегам (если они есть и есть желание), а полученное действие необходимо выполнять со следующего хода",
	"{{Зона}}Зона выбора игрока начинается с 1 и расширяется каждые 2 круга (1, 3, 5..) вплоть до 3 увелечений с каждой из сторон. Зона позволяет выбирать в том числе и в перенесенных случайных значениях. Игра может быть рерольнута, если на конкретно выпавшем значение основной тег не представлен, однако реролл по отсуствтвию альтернативы теперь должен быть применим и к игра внутри зоны",
]

